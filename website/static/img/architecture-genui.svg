<svg id="svg-genui" class="w-full h-auto max-h-[820px] select-none" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bgGenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0a0a14"/>
              <stop offset="100%" stop-color="#05050a"/>
            </linearGradient>
            <linearGradient id="genuiCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1f1530"/>
              <stop offset="100%" stop-color="#130d20"/>
            </linearGradient>

            <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="4" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
            <filter id="glow-cyan2" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="4" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>

            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4"/>
            </pattern>

            <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7"/>
            </marker>
            <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
            </marker>
            <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 8 5 L 0 9 z" fill="#0ea5e9"/>
            </marker>
          </defs>

          <!-- Background -->
          <rect width="1200" height="780" fill="url(#bgGenGrad)"/>
          <rect width="1200" height="780" fill="url(#grid)"/>

          <!-- Outer Boundary: GenUI Companion Stack -->
          <rect x="25" y="25" width="1150" height="730" rx="20" fill="#0d0d17" stroke="#4c1d95" stroke-width="1.5"/>

          <!-- Header -->
          <g transform="translate(45, 45)">
            <rect x="0" y="0" width="310" height="32" rx="8" fill="#2e1065" stroke="#6d28d9" stroke-width="1"/>
            <circle cx="16" cy="16" r="4" fill="#a855f7">
              <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
            </circle>
            <text x="32" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f5d0fe">GENUI &amp; AIOPS COPILOT STACK</text>
            <text x="245" y="21" font-family="'Fira Code', monospace" font-size="10" fill="#c084fc">compose-genui</text>
          </g>

          <!-- ============================================================ -->
          <!-- 1. OPERATOR / INPUT (Left) -->
          <!-- ============================================================ -->
          <g transform="translate(60, 260)">
            <rect x="0" y="0" width="200" height="150" rx="14" fill="#18181b" stroke="#71717a" stroke-width="1.5"/>
            <circle cx="100" cy="45" r="22" fill="#27272a"/>
            <!-- User Icon -->
            <path d="M 90 42 A 10 10 0 1 0 110 42 A 10 10 0 1 0 90 42 M 84 62 C 84 54, 116 54, 116 62" fill="none" stroke="#e4e4e7" stroke-width="2"/>
            <text x="100" y="90" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f4f4f5" text-anchor="middle">SRE Operator</text>
            <rect x="15" y="102" width="170" height="32" rx="6" fill="#27272a"/>
            <text x="22" y="116" font-family="'Inter', sans-serif" font-size="9" fill="#a1a1aa">"Diagnose CPU load &amp;</text>
            <text x="22" y="127" font-family="'Inter', sans-serif" font-size="9" fill="#a1a1aa">render remediation tool"</text>
          </g>

          <!-- ============================================================ -->
          <!-- 2. CHAINLIT COPILOT (Center Brain) -->
          <!-- ============================================================ -->
          <g transform="translate(330, 210)">
            <rect x="0" y="0" width="280" height="250" rx="16" fill="url(#genuiCardGrad)" stroke="#a855f7" stroke-width="2" filter="url(#glow-violet)"/>
            <rect x="0" y="0" width="280" height="250" rx="16" fill="url(#genuiCardGrad)" stroke="#a855f7" stroke-width="2"/>
            
            <text x="20" y="32" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f0abfc">Chainlit AIOps Copilot</text>
            <text x="20" y="52" font-family="'Fira Code', monospace" font-size="11" fill="#c084fc">Port :8050 • chainlit-genui</text>

            <rect x="18" y="68" width="244" height="40" rx="6" fill="#3b0764"/>
            <text x="28" y="86" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#f5d0fe">Step 1: pgvector RAG Lookup</text>
            <text x="28" y="98" font-family="'Fira Code', monospace" font-size="8.5" fill="#d8b4fe">Embedding cosine similarity</text>

            <rect x="18" y="116" width="244" height="40" rx="6" fill="#3b0764"/>
            <text x="28" y="134" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#f5d0fe">Step 2: MCP Tool Invocation</text>
            <text x="28" y="146" font-family="'Fira Code', monospace" font-size="8.5" fill="#d8b4fe">Query PromQL &amp; Loki logs</text>

            <rect x="18" y="164" width="244" height="40" rx="6" fill="#3b0764"/>
            <text x="28" y="182" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#f5d0fe">Step 3: Streaming Reasoning</text>
            <text x="28" y="194" font-family="'Fira Code', monospace" font-size="8.5" fill="#d8b4fe">OpenUI Lang component stream</text>

            <rect x="18" y="212" width="244" height="26" rx="4" fill="#581c87"/>
            <text x="28" y="228" font-family="'Inter', sans-serif" font-size="9" fill="#fae8ff">Interactive Preview iframe Embed</text>
          </g>

          <!-- Input Flow -->
          <path d="M 260 335 L 330 335" stroke="#a855f7" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-purple)">
            <animate attributeName="stroke-dashoffset" values="16;0" dur="0.9s" repeatCount="indefinite"/>
          </path>

          <!-- ============================================================ -->
          <!-- 3. PGVECTOR RAG (Top Right) -->
          <!-- ============================================================ -->
          <g transform="translate(730, 75)">
            <rect x="0" y="0" width="390" height="120" rx="14" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
            <text x="20" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">pgvector RAG Store (PostgreSQL 17)</text>
            <text x="20" y="48" font-family="'Fira Code', monospace" font-size="10.5" fill="#a7f3d0">Database: rag_storage • Table: operational_runbooks</text>
            
            <rect x="18" y="58" width="354" height="48" rx="6" fill="#064e3b"/>
            <text x="28" y="76" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#d1fae5">HNSW Cosine Vector Index (&lt;=&gt;)</text>
            <text x="28" y="92" font-family="'Fira Code', monospace" font-size="9" fill="#a7f3d0">vector(768) • Matches nomic-embed-text</text>
          </g>

          <!-- Flow: Chainlit <-> pgvector -->
          <path d="M 520 210 C 520 135, 700 135, 730 135" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-emerald)">
            <animate attributeName="stroke-dashoffset" values="18;0" dur="1.1s" repeatCount="indefinite"/>
          </path>

          <!-- ============================================================ -->
          <!-- 4. MCP TELEMETRY SUITE (Middle Right) -->
          <!-- ============================================================ -->
          <g transform="translate(730, 235)">
            <rect x="0" y="0" width="390" height="110" rx="14" fill="#0c1b2e" stroke="#0ea5e9" stroke-width="1.5"/>
            <text x="20" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Observability MCP Servers</text>
            <text x="20" y="48" font-family="'Fira Code', monospace" font-size="10.5" fill="#93c5fd">HTTP / Server-Sent Events (SSE)</text>

            <rect x="18" y="60" width="170" height="36" rx="6" fill="#1e3a5f"/>
            <text x="26" y="76" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#e0f2fe">Grafana MCP</text>
            <text x="26" y="88" font-family="'Fira Code', monospace" font-size="8.5" fill="#7dd3fc">:8000/sse</text>

            <rect x="200" y="60" width="170" height="36" rx="6" fill="#1e3a5f"/>
            <text x="208" y="76" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#e0f2fe">Prometheus MCP</text>
            <text x="208" y="88" font-family="'Fira Code', monospace" font-size="8.5" fill="#7dd3fc">:8080/sse</text>
          </g>

          <!-- Flow: Chainlit <-> MCP -->
          <path d="M 610 290 L 730 290" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-cyan)">
            <animate attributeName="stroke-dashoffset" values="16;0" dur="1s" repeatCount="indefinite"/>
          </path>

          <!-- ============================================================ -->
          <!-- 5. HOST OLLAMA VIA ENVOY (Lower Middle Right) -->
          <!-- ============================================================ -->
          <g transform="translate(730, 385)">
            <rect x="0" y="0" width="390" height="115" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
            <text x="20" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#c7d2fe">Envoy Gateway &amp; Host Ollama</text>
            <text x="20" y="48" font-family="'Fira Code', monospace" font-size="10.5" fill="#a5b4fc">http://ollama-gateway:11435 -&gt; 0.0.0.0:11434</text>
            
            <rect x="18" y="60" width="354" height="42" rx="6" fill="#312e81"/>
            <text x="28" y="78" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#e0e7ff">32k Context Window (OLLAMA_CONTEXT_LENGTH=32768)</text>
            <text x="28" y="92" font-family="'Fira Code', monospace" font-size="8.5" fill="#c7d2fe">Llama 3.2 • nomic-embed-text • Streamed Tokens</text>
          </g>

          <!-- Flow: Chainlit <-> Ollama Gateway -->
          <path d="M 610 395 C 670 395, 670 435, 730 435" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-purple)">
            <animate attributeName="stroke-dashoffset" values="16;0" dur="0.85s" repeatCount="indefinite"/>
          </path>

          <!-- ============================================================ -->
          <!-- 6. OPEN-INTELLIGENT-UI GENERATOR (Bottom) -->
          <!-- ============================================================ -->
          <g transform="translate(330, 540)">
            <rect x="0" y="0" width="790" height="175" rx="16" fill="#180b26" stroke="#d946ef" stroke-width="2" filter="url(#glow-violet)"/>
            <rect x="0" y="0" width="790" height="175" rx="16" fill="#180b26" stroke="#d946ef" stroke-width="2"/>
            
            <text x="24" y="32" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f472b6">Open-Intelligent-UI Canvas</text>
            <text x="24" y="52" font-family="'Fira Code', monospace" font-size="11" fill="#fbcfe8">Port :3001 • Container: open-intelligent-ui • Next.js + @openuidev/react</text>

            <!-- Dynamic UI Mockup Panels -->
            <g transform="translate(24, 68)">
              <!-- Widget 1: CPU Metric -->
              <rect x="0" y="0" width="230" height="90" rx="8" fill="#2a1240" stroke="#c026d3" stroke-width="1"/>
              <text x="14" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f5d0fe">Container CPU Usage</text>
              <text x="14" y="52" font-family="'Fira Code', monospace" font-size="22" font-weight="700" fill="#38bdf8">92.4%</text>
              <rect x="14" y="64" width="120" height="16" rx="4" fill="#991b1b"/>
              <text x="20" y="76" font-family="'Inter', sans-serif" font-size="9" fill="#fecaca">Threshold Exceeded</text>
            </g>

            <g transform="translate(270, 68)">
              <!-- Widget 2: Remediation Action -->
              <rect x="0" y="0" width="240" height="90" rx="8" fill="#2a1240" stroke="#c026d3" stroke-width="1"/>
              <text x="14" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f5d0fe">Suggested SRE Action</text>
              <text x="14" y="44" font-family="'Inter', sans-serif" font-size="9.5" fill="#e9d5ff">Restart high-consumer container:</text>
              <rect x="14" y="54" width="130" height="24" rx="4" fill="#0284c7"/>
              <text x="22" y="70" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff">⚡ Restart Container</text>
            </g>

            <g transform="translate(526, 68)">
              <!-- Widget 3: Live PromQL Sparkline -->
              <rect x="0" y="0" width="240" height="90" rx="8" fill="#2a1240" stroke="#c026d3" stroke-width="1"/>
              <text x="14" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f5d0fe">Live PromQL Telemetry</text>
              <path d="M 14 65 Q 40 40, 80 55 T 140 35 T 200 45" fill="none" stroke="#22d3ee" stroke-width="2"/>
              <text x="14" y="80" font-family="'Fira Code', monospace" font-size="8.5" fill="#a7f3d0">rate(container_cpu[1m])</text>
            </g>
          </g>

          <!-- Flow: Chainlit down to OpenUI -->
          <path d="M 470 460 L 470 540" stroke="#f472b6" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-purple)">
            <animate attributeName="stroke-dashoffset" values="16;0" dur="0.9s" repeatCount="indefinite"/>
          </path>
        </svg>
