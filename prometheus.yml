# Prometheus v3.x configuration
# Reference: https://prometheus.io/docs/prometheus/latest/configuration/configuration/
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: dockprom-ai

# Alerts are sent to AlertManager (service name on the "monitoring" network)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert-rules.yml

# Forward all samples to VictoriaMetrics for long-term storage
remote_write:
  - url: http://victoriametrics:8428/api/v1/write

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

  - job_name: victoriametrics
    static_configs:
      - targets: ['victoriametrics:8428']

  # OpenTelemetry Collector: self metrics (8890) and metrics exported from OTLP (8889)
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8890', 'otel-collector:8889']
