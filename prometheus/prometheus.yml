global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
  - job_name: logporter
    static_configs:
      - targets:
          - logporter:9333
  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway:9091
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889
