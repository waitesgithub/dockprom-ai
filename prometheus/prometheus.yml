global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    stack: dockprom-ai

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: envoy-ollama-gateway
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["ollama-gateway:9901"]

  - job_name: ollama-exporter
    static_configs:
      - targets: ["ollama-exporter:9092"]

  - job_name: chainlit-genui
    static_configs:
      - targets: ["chainlit-genui:8000"]

  - job_name: open-intelligent-ui
    static_configs:
      - targets: ["open-intelligent-ui:3000"]

  - job_name: mcp-grafana
    static_configs:
      - targets: ["mcp-grafana:8000"]

  - job_name: prometheus-mcp
    static_configs:
      - targets: ["prometheus-mcp:8080"]

  - job_name: caddy
    static_configs:
      - targets: ["caddy:2019"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: keep
    static_configs:
      - targets: ["keep-backend:8080"]

  - job_name: dcgm-exporter
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  - job_name: falco
    static_configs:
      - targets: ["falco:8765"]

  # Add AMD SMI, Intel device, Trivy Operator, or other exporter targets only
  # after enabling the corresponding optional integration documented in
  # website/docs/deployment/exporters-security-tools.md.
