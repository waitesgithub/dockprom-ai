# Tempo config (monolithic, local storage)
# Reference: https://grafana.com/docs/tempo/latest/configuration/
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Tempo 3.x replaced the compactor with backend-scheduler/backend-worker;
# block retention now lives here (monolithic mode runs them in-process).
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 336h

backend_worker:
  compaction:
    block_retention: 336h

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

usage_report:
  reporting_enabled: false
