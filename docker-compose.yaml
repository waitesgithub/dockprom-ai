# version: '3.8'

networks:
  monitoring:
    driver: bridge
    name: monitoring
    
volumes:
  prometheus_data:
    name: prometheus_data
  grafana-data:
    name: grafana-data
  loki-data:
    name: loki-data
  tempo-data:
    name: tempo-data
  otel-data:
    name: otel-data
  caddy-data:
    name: caddy-data
  ollama-data:
    name: ollama-data
    
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'  # retention time
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'   
    ports:
      - "9090:9090"
    networks:
      - monitoring
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
        loki-external-url: http://loki:3100
        labels: "service=prometheus,job=monitoring"


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
        loki-external-url: http://loki:3100
        labels: "service=grafana,job=monitoring"


  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.processes'
    ports:
      - "9100:9100"
    networks:
      - monitoring
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
        loki-external-url: http://loki:3100
        labels: "service=node-exporter,job=monitoring"


  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports: 
      - "9093:9093"
    command:
      - --config.file=/etc/alertmanager/alert-config.yaml
    volumes:
      - ./alert-config.yaml:/etc/alertmanager/alert-config.yaml 
      - ./alert-email-template.tmpl:/etc/alertmanager/email-template.tmpl:ro
    networks:
      - monitoring
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
        loki-external-url: http://loki:3100
        labels: "service=alertmanager,job=monitoring"


  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    ports:     
      - "3200:3200"     # Tempo HTTP API 
      - "4317"  # otlp grpc
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo    # compatible with storage path 
    command: ["-config.file=/etc/tempo.yaml"]
    networks:
      - monitoring
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
        loki-external-url: http://loki:3100
        labels: "service=tempo,job=monitoring"


  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"  # Loki HTTP port
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml
      - loki-data:/loki 
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
        loki-external-url: http://loki:3100
        labels: "service=loki,job=monitoring"


  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    command: 
      - "--config=/etc/otelcol-contrib/config.yaml"
    environment:
      - OTELCOL_LOG_LEVEL=debug    # <- We set the log level here
    ports:
      - 1888:1888 # pprof extension
      - 8890:8890 # Prometheus metrics exposed by the Collector
      - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      - 55679:55679 # zpages extension        
    networks:
      - monitoring
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
        loki-external-url: http://loki:3100
        labels: "service=otel-collector,job=monitoring"


  logporter:
    image: logporter:latest
    container_name: logporter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9333:9333"
    networks:
      - monitoring
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
        loki-external-url: http://loki:3100
        labels: "service=logporter,job=monitoring"

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      - monitoring
    depends_on:
      grafana:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
        loki-external-url: http://loki:3100
        labels: "service=caddy,job=monitoring"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # Optional NVIDIA GPU support: uncomment the block below
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - monitoring
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
        loki-external-url: http://loki:3100
        labels: "service=ollama,job=monitoring"

  mcp-grafana:
    image: grafana/mcp-grafana:latest
    container_name: mcp-grafana
    restart: unless-stopped
    # SSE transport on port 8000; use "-t stdio" with `docker run -i` for stdio clients
    command: ["-t", "sse", "-address", "0.0.0.0:8000", "--log-level", "info"]
    environment:
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_SERVICE_ACCOUNT_TOKEN=${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - monitoring
    depends_on:
      grafana:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
        loki-external-url: http://loki:3100
        labels: "service=mcp-grafana,job=monitoring"
