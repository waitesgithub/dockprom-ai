networks:
  monitoring:
    name: monitoring
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  caddy_data:
  caddy_config:

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    restart: unless-stopped
    env_file:
      - ./config
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD before starting the stack}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.processes
    ports:
      - "9100:9100"
    networks:
      - monitoring

  logporter:
    image: lifailon/logporter:latest
    container_name: logporter
    restart: unless-stopped
    environment:
      DOCKER_METRICS_PORT: "9333"
      LOKI_URL: http://loki:3100
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9333:9333"
    depends_on:
      - loki
    networks:
      - monitoring

  pushgateway:
    image: prom/pushgateway:v1.11.4
    container_name: pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:0.34.1
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - monitoring

  caddy:
    image: caddy:v2.11.7
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - grafana
    networks:
      - monitoring

  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/data/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo.yaml
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
    networks:
      - monitoring

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./otel/collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "8890:8890"
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
    networks:
      - monitoring

  mcp-grafana:
    build:
      context: ./mcp-grafana
      args:
        MCP_GRAFANA_VERSION: v2.1.1
    image: dockprom-ai/mcp-grafana:2.1.1
    container_name: mcp-grafana
    restart: unless-stopped
    profiles:
      - mcp
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - grafana
    networks:
      - monitoring
