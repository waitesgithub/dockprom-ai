networks:
  monitoring:
    driver: bridge
  docker-api:
    driver: bridge
    internal: true

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  alertmanager_data:

services:
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
      - node-exporter
      - logporter
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    restart: unless-stopped
    env_file:
      - ./config
    environment:
      GF_SECURITY_ADMIN_USER: ${ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP:-false}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring

  docker-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      DISTRIBUTION: "1"
      IMAGES: "1"
      INFO: "1"
      SYSTEM: "1"
      VOLUMES: "1"
      ALLOW_LOGS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  logporter:
    image: lifailon/logporter:latest
    container_name: logporter
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_METRICS_VOLUME: "true"
      DOCKER_METRICS_VOLUME_CACHE: "30"
      DOCKER_METRICS_IMAGE_UPDATE: "true"
      DOCKER_METRICS_IMAGE_INTERVAL: "30"
      LOKI_URL: http://loki:3100
      LOKI_PUSH_SECONDS: "5"
      LOKI_PUSH_LINES: "1000"
      DASHBOARD_USERNAME: ${LOGPORTER_DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${LOGPORTER_DASHBOARD_PASSWORD:-admin}
    ports:
      - "127.0.0.1:9333:9333"
    depends_on:
      - docker-proxy
      - loki
    networks:
      - monitoring
      - docker-api

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo.yml
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/tmp/tempo
    depends_on:
      tempo-volume-init:
        condition: service_completed_successfully
    networks:
      - monitoring

  tempo-volume-init:
    image: busybox:1.37.0
    container_name: tempo-volume-init
    user: "0:0"
    command:
      - sh
      - -c
      - chown -R 10001:10001 /tempo
    restart: "no"
    network_mode: none
    volumes:
      - tempo_data:/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - loki
      - tempo
    networks:
      - monitoring

  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9091"
    networks:
      - monitoring

  caddy:
    image: caddy:2.11.2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - grafana
    networks:
      - monitoring

  mcp-grafana:
    image: dockprom-ai/mcp-grafana:v2.1.1
    build:
      context: ./mcp-grafana
      args:
        MCP_GRAFANA_VERSION: v2.1.1
    container_name: mcp-grafana
    restart: unless-stopped
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
      MCP_GRAFANA_SERVER_TOKEN: ${MCP_GRAFANA_SERVER_TOKEN:?Set MCP_GRAFANA_SERVER_TOKEN in config}
    command:
      - --allowed-hosts=localhost:8000,127.0.0.1:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - grafana
    networks:
      - monitoring
