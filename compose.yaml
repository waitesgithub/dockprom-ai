name: dockprom-ai

x-security-defaults: &security-defaults
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  prometheus:
    <<: *security-defaults
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.15.1}
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitor-net
    restart: unless-stopped

  grafana:
    <<: *security-defaults
    image: grafana/grafana-oss:${GRAFANA_VERSION:-13.0.2}
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GRAFANA_POSTGRES_USER: ${GRAFANA_POSTGRES_USER:-grafana_reader}
      GRAFANA_POSTGRES_PASSWORD: ${GRAFANA_POSTGRES_PASSWORD:?Set GRAFANA_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - monitor-net
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    <<: *security-defaults
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.12.1}
    container_name: node-exporter
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitor-net
    restart: unless-stopped

  postgres-exporter:
    <<: *security-defaults
    image: prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER_VERSION:-v0.20.1}
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:?Set POSTGRES_EXPORTER_DSN}
    networks:
      - monitor-net
    restart: unless-stopped

  # Placeholder target for NVIDIA GPU telemetry. Enable only after installing
  # the NVIDIA Container Toolkit and confirming compatible DCGM hardware.
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:${DCGM_EXPORTER_VERSION:-4.4.1-4.6.0-ubuntu22.04}
    container_name: dcgm-exporter
    profiles: ["nvidia"]
    cap_add:
      - SYS_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    networks:
      - monitor-net
    restart: unless-stopped

networks:
  monitor-net:
    name: monitor-net

volumes:
  grafana-data:
  prometheus-data:
