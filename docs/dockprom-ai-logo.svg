<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="dockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box & Circuit Nodes -->
  <g transform="translate(15, 15)">
    <!-- Circuit frame -->
    <rect x="0" y="0" width="90" height="90" rx="18" fill="url(#boxBg)" stroke="url(#dockGrad)" stroke-width="2.5" filter="url(#glow)" />
    
    <!-- Microchip Pins -->
    <line x1="20" y1="0" x2="20" y2="-6" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="45" y1="0" x2="45" y2="-6" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="70" y1="0" x2="70" y2="-6" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
    
    <line x1="20" y1="90" x2="20" y2="96" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="45" y1="90" x2="45" y2="96" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="70" y1="90" x2="70" y2="96" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />

    <!-- Metrics Pulse Wave -->
    <path d="M 12 45 L 26 45 L 34 22 L 46 68 L 56 36 L 64 45 L 78 45" fill="none" stroke="url(#dockGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central AI Core Node -->
    <circle cx="45" cy="45" r="5" fill="#38bdf8" />
    <circle cx="45" cy="45" r="8" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 42)">
    <text x="0" y="24" fill="#f0f6fc" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
      Dockprom<tspan fill="#38bdf8">-AI</tspan>
    </text>
    <text x="2" y="48" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="2">
      OBSERVABILITY & AIOPS PLATFORM
    </text>
  </g>
</svg>
