<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <g transform="translate(15, 15)">
    <!-- Chassis Body -->
    <rect x="0" y="0" width="90" height="90" rx="16" fill="url(#bgGrad)" stroke="url(#brandGrad)" stroke-width="2.5" />
    
    <!-- Microchip Connector Pins Top/Bottom -->
    <line x1="22" y1="0" x2="22" y2="-5" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="45" y1="0" x2="45" y2="-5" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="68" y1="0" x2="68" y2="-5" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
    
    <line x1="22" y1="90" x2="22" y2="95" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="45" y1="90" x2="45" y2="95" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="68" y1="90" x2="68" y2="95" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />

    <!-- Telemetry Pulse Wave -->
    <path d="M 12 45 L 26 45 L 34 22 L 46 68 L 56 36 L 64 45 L 78 45" fill="none" stroke="url(#brandGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- AI Core Nodes -->
    <circle cx="45" cy="45" r="5" fill="#38bdf8" />
    <circle cx="45" cy="45" r="9" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 2" />
  </g>

  <!-- Typography -->
  <g transform="translate(125, 42)">
    <text x="0" y="24" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Dockprom<tspan fill="#38bdf8">-AI</tspan>
    </text>
    <text x="2" y="48" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2">
      OBSERVABILITY & AIOPS PLATFORM
    </text>
  </g>
</svg>
