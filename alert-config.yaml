global:
  resolve_timeout: 5m
  # Replace with your SMTP server and credentials
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@example.com'
  smtp_auth_username: 'alertmanager@example.com'
  smtp_auth_password: 'CHANGE_ME'
  smtp_require_tls: true

templates:
  - /etc/alertmanager/email-template.tmpl

route:
  receiver: email
  group_by: ['alertname', 'containerName']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email
    email_configs:
      - to: 'you@example.com'
        send_resolved: true
        headers:
          subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        html: '{{ template "email.custom.html" . }}'
